name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so a quick re-push doesn't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cheap, browser-free gate: the shared solver core must parse. This is the
      # same `node --check fast_solver.js` the local workflow relies on.
      - name: Solver syntax check
        run: node --check fast_solver.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Chromium is needed for the solver/e2e fixtures; the pure-Python tests run
      # regardless. If this step somehow fails, the browser-backed tests skip
      # themselves (see tests/conftest.py) rather than failing the build.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q
